name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request that supersedes an in-flight run should cancel it rather than
# queue behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      # Report every service's result. Without this the first failure hides the
      # state of the other six, which is the opposite of what a first CI run is
      # for.
      fail-fast: false
      matrix:
        service:
          - astral
          - forge
          - horizon
          - library
          - nebula
          - satellite
          - singularity

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node 20+ requirement in the README.
          node-version: '20'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # FAILS if package.json and package-lock.json disagree. That check is worth
      # having on its own, independently of any test.
      - name: Install
        working-directory: services/${{ matrix.service }}
        env:
          # horizon depends on puppeteer, which downloads a ~400 MB Chromium on
          # install. Nothing under test drives a browser, and the download
          # dominates the job otherwise.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      # horizon's Typst renderer tests and golden page images need the typst
      # binary; without it they skip. Pinned by version and checksum, and kept
      # in step with services/horizon/test/golden/TYPST_VERSION -- with any
      # other version the golden test skips rather than runs.
      - name: Install Typst
        if: matrix.service == 'horizon'
        env:
          TYPST_VERSION: '0.15.1'
          TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
        run: |
          curl -fsSL -o "$RUNNER_TEMP/typst.tar.xz" \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version

      # --if-present so a service without tests yet is skipped rather than
      # failing on a missing script. Services opt in by adding a "test" script as
      # they gain coverage; no placeholder scripts are needed in the meantime.
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: npm test --if-present
