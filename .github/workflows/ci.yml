name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request that supersedes an in-flight run should cancel it rather than
# queue behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      # Report every service's result. Without this the first failure hides the
      # state of the other six, which is the opposite of what a first CI run is
      # for.
      fail-fast: false
      matrix:
        service:
          - astral
          - forge
          - horizon
          - library
          - nebula
          - satellite
          - singularity

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node 20+ requirement in the README.
          node-version: '20'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # FAILS if package.json and package-lock.json disagree. That check is worth
      # having on its own, independently of any test.
      - name: Install
        working-directory: services/${{ matrix.service }}
        env:
          # horizon depends on puppeteer, which downloads a ~400 MB Chromium on
          # install. Nothing under test drives a browser, and the download
          # dominates the job otherwise.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      # --if-present so a service without tests yet is skipped rather than
      # failing on a missing script. Services opt in by adding a "test" script as
      # they gain coverage; no placeholder scripts are needed in the meantime.
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: npm test --if-present
