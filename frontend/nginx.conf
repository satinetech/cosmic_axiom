server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the /healthz the backend services expose, so every container in a
    # deployment answers the same probe in the same way.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # Vite emits content-hashed filenames, so an asset's URL changes whenever its
    # content does and an old URL is never reused. Those can be cached forever.
    #
    # =404 rather than falling through to the SPA handler below: a missing asset
    # means a broken deploy, and answering it with index.html would return HTML
    # with a 200 status where the browser expected JavaScript -- which surfaces
    # as an unexplained syntax error rather than a plain 404.
    location /assets/ {
        try_files $uri =404;
        # One header, not `expires 1y` plus an add_header -- that combination
        # emits two Cache-Control lines, which is ambiguous and needless.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html names those hashed assets, so a cached copy pins the whole
    # application to an old build. It has to be revalidated every time.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing. /findings, /reports/:id and the rest are React Router
    # paths, not files on disk. Anything that is not a real file is handed to
    # index.html, so a deep link or a page refresh loads the app instead of
    # returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    # Both spellings of the JavaScript type: nginx has mapped .js to
    # application/javascript and to text/javascript in different releases.
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
