# ============================================================================
# Edge proxy
# ============================================================================
# One origin for the whole application: static files at /, the API under /api.
#
# WHY ONE ORIGIN. Two published ports means the browser talks to two origins,
# which needs CORS, and -- more importantly -- means there are two places a
# deployment could establish identity. One of them will eventually be forgotten.
# A single entry point is the only one that can be reasoned about.
# ============================================================================

# WebSocket/upgrade passthrough. Nothing uses it today; having it here means a
# future endpoint that does will not fail in a way that takes an afternoon to
# diagnose.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Evidence screenshots are uploaded through the API. nginx's default is 1 MB,
    # which rejects a screenshot of any modern display with a 413 that looks like
    # an application bug rather than a proxy limit.
    client_max_body_size 25m;

    # ------------------------------------------------------------------------
    # Identity headers: cleared unconditionally, on every request, before
    # anything is proxied.
    # ------------------------------------------------------------------------
    # This is the one part of this file that is load-bearing for security, and
    # it is worth stating the argument in full because the conclusion looks
    # paranoid out of context.
    #
    # A forward-auth deployment puts an authenticating proxy in front of the
    # application -- Tailscale Serve, oauth2-proxy, Authelia, an ALB with OIDC --
    # and that proxy injects the authenticated identity as request headers. The
    # application trusts those headers. That is the whole mechanism, and it is
    # sound only while ONE condition holds:
    #
    #     the application can be reached by nothing except that proxy.
    #
    # If any path exists by which a client reaches the application directly, the
    # client simply sends the header itself and is whoever it likes. Forward-auth
    # has no cryptographic component; the header is trustworthy only because of
    # where it came from.
    #
    # So this proxy clears every header in the identity namespace on the way in.
    # An inbound `X-Forwarded-User: admin` from a browser is overwritten with
    # nothing, and cannot reach the application. The authenticating proxy in
    # front then sets its own value, and because that happens after this point,
    # its value is the only one that survives.
    #
    # Setting a proxy_set_header to the empty string removes the header rather
    # than forwarding it empty -- that is what these lines do.
    #
    # This costs nothing when no forward-auth proxy is deployed, which is the
    # default for this project today. It is here BEFORE it is needed, because
    # the order in which those two things get set up is exactly how this goes
    # wrong: someone adds the authenticating proxy later, and the fact that the
    # application was reachable without it was never a problem until it was.
    #
    # Tailscale Serve
    proxy_set_header Tailscale-User-Login "";
    proxy_set_header Tailscale-User-Name "";
    proxy_set_header Tailscale-User-Profile-Pic "";
    # oauth2-proxy
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Forwarded-Groups "";
    proxy_set_header X-Forwarded-Preferred-Username "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header X-Auth-Request-Preferred-Username "";
    # Authelia, authentik, and the generic spelling
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Remote-Email "";
    proxy_set_header X-Remote-Groups "";
    proxy_set_header X-Remote-Name "";
    proxy_set_header Remote-User "";
    proxy_set_header Remote-Email "";
    proxy_set_header Remote-Groups "";
    proxy_set_header Remote-Name "";

    # ------------------------------------------------------------------------
    # Forwarding metadata
    # ------------------------------------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter APPENDS to
    # whatever the client sent, so a client can prepend an arbitrary chain and
    # anything that reads the left-most entry -- rate limiters, audit logs,
    # IP allowlists -- reads a value the client chose. Replacing it is correct
    # when this proxy is the first trusted hop, which it is by default here.
    #
    # If you put a trusted proxy in front of this one, do NOT switch this to
    # append. Use nginx's real_ip module, which distinguishes trusted hops from
    # client-supplied ones:
    #
    #     set_real_ip_from 10.0.0.0/8;   # the trusted proxy, and only it
    #     real_ip_header   X-Forwarded-For;
    #     real_ip_recursive on;
    proxy_set_header X-Forwarded-For $remote_addr;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Report rendering is slow and synchronous. The 60s default turns a large
    # report into a 504 that looks like a crash.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ------------------------------------------------------------------------
    # Routing
    # ------------------------------------------------------------------------
    # Upstreams are resolved per request through Docker's embedded DNS rather
    # than once at startup. With a literal `proxy_pass http://satellite:3005`,
    # nginx resolves the name when the config loads and caches the address
    # forever -- so recreating satellite without also recreating nginx yields
    # 502s until someone restarts the proxy. Assigning to a variable forces
    # re-resolution, and `valid=10s` bounds how long a stale answer can persist.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"edge"}';
    }

    # The API. The /api prefix is stripped: satellite serves /users, /findings
    # and the rest at its root.
    #
    # A prefix is required rather than routing by bare path, because the SPA has
    # client-side routes at /findings, /reports and /customers that collide
    # exactly with satellite's own paths. Without the prefix this proxy could not
    # tell a page request from an API call.
    location ~ ^/api/(.*)$ {
        set $satellite_upstream http://satellite:3005;
        proxy_pass $satellite_upstream/$1$is_args$args;
    }

    # Everything else is the application: static assets and the SPA fallback,
    # both of which the frontend container already handles.
    location / {
        set $frontend_upstream http://frontend:8080;
        proxy_pass $frontend_upstream$request_uri;
    }
}
